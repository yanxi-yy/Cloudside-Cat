<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云边工具箱</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0f0f23;
            --bg-secondary: #1a1a2e;
            --bg-card: #16213e;
            --bg-card-hover: #1f3460;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --accent-color: #4a9eff;
            --accent-glow: rgba(74, 158, 255, 0.3);
            --status-online: #00ff88;
            --status-dev: #666680;
            --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.3);
            --shadow-hover: 0 8px 30px rgba(74, 158, 255, 0.2);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: var(--text-primary);
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(90deg, var(--accent-color), #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 10px;
        }

        .tool-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 28px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .tool-card:hover:not(.disabled) {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
            border-color: var(--accent-color);
            background: var(--bg-card-hover);
        }

        .tool-card.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: rgba(22, 33, 62, 0.6);
        }

        .tool-icon {
            font-size: 2.5rem;
            margin-bottom: 16px;
            display: block;
        }

        .tool-name {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .tool-desc {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 16px;
            line-height: 1.5;
        }

        .status-tag {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .status-online {
            background: rgba(0, 255, 136, 0.15);
            color: var(--status-online);
        }

        .status-dev {
            background: rgba(102, 102, 128, 0.15);
            color: var(--status-dev);
        }

        @media (max-width: 768px) {
            body {
                padding: 20px 15px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .tools-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .tool-card {
                padding: 22px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>云边工具箱</h1>
        <p class="subtitle">探索 AI 驱动的实用工具集</p>
    </header>

    <main class="tools-grid">
        <div class="tool-card" onclick="window.location.href='calculator.html'">
            <span class="tool-icon">📈</span>
            <h3 class="tool-name">股票做T计算器</h3>
            <p class="tool-desc">智能计算股票做T收益，助您把握交易时机</p>
            <span class="status-tag status-online">已上线</span>
        </div>

        <div class="tool-card" onclick="window.location.href='worldcup.html'">
            <span class="tool-icon">⚽</span>
            <h3 class="tool-name">世界杯冠军投票</h3>
            <p class="tool-desc">为您支持的球队投票，见证冠军诞生</p>
            <span class="status-tag status-online">已上线</span>
        </div>

        <div class="tool-card" onclick="window.location.href='psychology.html'">
            <span class="tool-icon">🧠</span>
            <h3 class="tool-name">心理测试</h3>
            <p class="tool-desc">探索内心世界，了解真实的自己</p>
            <span class="status-tag status-online">已上线</span>
        </div>

        <div class="tool-card disabled">
            <span class="tool-icon">🎮</span>
            <h3 class="tool-name">情绪疏解小游戏</h3>
            <p class="tool-desc">通过趣味游戏释放压力，放松身心</p>
            <span class="status-tag status-dev">开发中</span>
        </div>

        <div class="tool-card disabled">
            <span class="tool-icon">💡</span>
            <h3 class="tool-name">个人能力探索测试</h3>
            <p class="tool-desc">发现您的潜能，规划职业发展方向</p>
            <span class="status-tag status-dev">开发中</span>
        </div>

        <div class="tool-card" onclick="window.location.href='car.html'">
            <span class="tool-icon">🚗</span>
            <h3 class="tool-name">汽车工具</h3>
            <p class="tool-desc">汽车相关工具集，助您出行更便捷</p>
            <span class="status-tag status-online">已上线</span>
        </div>

        <div class="tool-card" onclick="window.location.href='jianfei.html'">
            <span class="tool-icon">🏋️</span>
            <h3 class="tool-name">减肥工具</h3>
            <p class="tool-desc">科学减肥辅助工具，健康瘦身每一天</p>
            <span class="status-tag status-online">已上线</span>
        </div>

        <div class="tool-card" onclick="window.location.href='yamaxun.html'">
            <span class="tool-icon">🛒</span>
            <h3 class="tool-name">亚马逊工具</h3>
            <p class="tool-desc">亚马逊运营辅助工具，提升销售效率</p>
            <span class="status-tag status-online">已上线</span>
        </div>
    </main>
</body>
</html>
